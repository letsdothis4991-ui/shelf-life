<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shelf Life</title>
  <meta name="description" content="A quiet reading tracker for physical books: progress, pace, notes and insights.">
  <meta name="theme-color" content="#F2EFEE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131110" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Shelf Life">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Figtree:wght@400;500;600&family=Fragment+Mono&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="sheet">
    <header class="appbar">
      <a class="brand" href="#">Shelf Life</a>
      <nav aria-label="Main">
        <a href="#" data-nav="home">Home</a>
        <a href="#notes" data-nav="notes">Notes</a>
        <a href="#insights" data-nav="insights">Insights</a>
        <a href="#sync" data-nav="sync">Sync <span id="sync-dot" class="sync-dot off" aria-hidden="true"></span></a>
      </nav>
      <span class="sp"></span>
      <a class="btn primary" href="#add">Add a book</a>
    </header>
    <main id="main" class="inner" tabindex="-1"></main>
  </div>
  <div id="tip" role="tooltip" hidden></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <script src="app.js"></script>
</body>
</html>
